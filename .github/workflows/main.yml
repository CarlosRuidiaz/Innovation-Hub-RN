name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Corren sin Roble: con datasources falsos o en memoria, y sin .env.
      - name: Pruebas
        run: npm run test:ci
